<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Voyage Heure — Check-list d'équipe</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <img src="assets/logo.png" alt="Le Voyage Heure" class="site-header__logo">
    <div class="site-header__text">
      <h1>Le Voyage Heure</h1>
      <p>Check-list d'équipe</p>
    </div>
  </header>

  <main class="page">

    <div class="switcher" role="tablist" aria-label="Choix de la check-list">
      <button class="switcher__option is-active" data-tab="ouverture" role="tab" aria-selected="true" type="button">Ouverture</button>
      <button class="switcher__option" data-tab="fermeture" role="tab" aria-selected="false" type="button">Fermeture</button>
    </div>

    <section class="ticket" id="checklist-card">
      <div class="ticket__accent"></div>
      <div class="ticket__body">

        <div class="ticket__header">
          <h2 id="checklist-title">Check-list d'ouverture</h2>
          <span class="ticket__date" id="checklist-date"></span>
        </div>

        <label class="field">
          <span class="field__label">Votre nom</span>
          <input type="text" id="employee-name" placeholder="Prénom et nom" autocomplete="name">
        </label>

        <div id="checklist-items" class="checklist" aria-live="polite">
          <p class="checklist__empty">Chargement de la check-list…</p>
        </div>

        <button class="btn btn--primary" id="submit-btn" type="button">Valider et envoyer</button>
        <p class="form-note" id="form-note" role="status"></p>
      </div>
    </section>

    <section class="ticket ticket--success" id="success-card" hidden>
      <div class="ticket__accent ticket__accent--success"></div>
      <div class="ticket__body ticket__body--center">
        <h2>Envoyée</h2>
        <p id="success-text">La check-list a été transmise par e-mail.</p>
        <button class="btn btn--ghost" id="new-checklist-btn" type="button">Remplir une nouvelle check-list</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <a href="admin.html">Administration</a>
  </footer>

  <!-- Firebase (lecture de la configuration) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <!-- EmailJS (envoi du mail) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
